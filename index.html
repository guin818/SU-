<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SU!!!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&text=SU!&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff6e5; --ink:#1b1b1f; --pop:#ff4d2e; --sun:#ffd23f;
    --sky:#3ec6ff; --mint:#3ddc97; --card:#ffffff; --shadow:4px 4px 0 var(--ink);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--bg);
    background-image:radial-gradient(var(--ink) 1px, transparent 1.2px);
    background-size:22px 22px; 
    color:var(--ink); font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    display:flex; justify-content:center; padding:40px 18px 60px;
  }
  .wrap{width:100%;max-width:680px}
  header{text-align:center;margin-bottom:24px;transition:margin .3s}
  .logo{
    font-family:"Black Han Sans",sans-serif;
    font-size:clamp(84px,24vw,148px); line-height:.9; margin:0; letter-spacing:-2px;
    color:var(--pop); -webkit-text-stroke:3px var(--ink); text-shadow:6px 6px 0 var(--ink);
    display:inline-block; transform:rotate(-3deg); user-select:none; cursor:pointer;
    transition:font-size .3s;
  }
  body.has-result .logo{font-size:clamp(56px,14vw,84px);text-shadow:4px 4px 0 var(--ink)}
  body.has-result .tag{display:none}
  .logo span{display:inline-block;color:var(--sun);animation:hop 1.6s ease-in-out infinite}
  .logo span:nth-child(2){animation-delay:.15s;color:var(--sky)}
  .logo span:nth-child(3){animation-delay:.3s;color:var(--mint)}
  @keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-14px) rotate(6deg)}}
  @media (prefers-reduced-motion:reduce){.logo span{animation:none}}
  .tag{margin:14px 0 0;font-size:17px}

  .box{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:var(--shadow);padding:18px}
  .row{display:flex;gap:10px;align-items:stretch}
  .field{position:relative;flex:1;min-width:0}
  input[type=search]{
    width:100%; font:inherit; font-size:19px; padding:15px 44px 15px 16px;
    border:3px solid var(--ink); border-radius:14px; outline:none; background:#fffdf7;
    -webkit-appearance:none; appearance:none; color:var(--ink);
  }
  input[type=search]::-webkit-search-cancel-button{display:none}
  input[type=search]:focus{background:#fff;box-shadow:0 0 0 4px var(--sun)}
  .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:none;background:#eee;font-size:16px;cursor:pointer;display:none;color:var(--ink)}
  .clear.show{display:block}
  .go{
    font-family:"Black Han Sans",system-ui,sans-serif; font-weight:900; font-size:21px; padding:0 22px;
    background:var(--pop); color:#fff; border:3px solid var(--ink); border-radius:14px;
    box-shadow:3px 3px 0 var(--ink); cursor:pointer; white-space:nowrap;
    transition:transform .08s, box-shadow .08s;
  }
  .go:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .go:disabled{background:#bbb;cursor:default}

  .label{font-weight:800;font-size:15px;margin:0 0 10px;letter-spacing:.5px}

  /* 결과 */
  #result{margin-top:22px;display:none}
  body.has-result #result{display:block}
  .q-title{font-weight:800;font-size:22px;margin:0 0 12px;word-break:keep-all}
  .answer{font-size:17px;line-height:1.75;word-break:keep-all}
  .answer p{margin:0 0 12px}
  .answer ul{margin:0 0 12px;padding-left:22px}
  .answer li{margin-bottom:6px}
  .answer h3{font-weight:800;font-size:17px;margin:16px 0 8px}
  .answer strong{background:linear-gradient(transparent 55%, var(--sun) 55%)}
  .answer .summary{font-size:19px;font-weight:700;background:#fff3c4;border:2px dashed var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:14px}
  .thinking{display:flex;align-items:center;gap:10px;font-size:17px}
  .dots span{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pop);margin-right:4px;animation:bounce 1s infinite}
  .dots span:nth-child(2){background:var(--sky);animation-delay:.15s}
  .dots span:nth-child(3){background:var(--mint);animation-delay:.3s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
  .err{background:#ffe1dc;border:2px solid var(--ink);border-radius:12px;padding:12px 14px;font-size:15px}
  .note{font-size:13px;opacity:.65;margin-top:6px}

  .section{margin-top:18px;padding-top:16px;border-top:2px dashed #ccc}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    font:inherit;font-size:15px;padding:8px 12px;border-radius:999px;
    border:2px solid var(--ink);background:var(--card);cursor:pointer;color:var(--ink);
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;
  }
  .chip:hover{background:var(--sky)}
  .chip.rel{background:#eafaf2}
  .chip.rel:hover{background:var(--mint)}
  .links{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .lnk{
    font-size:13px;font-weight:700;padding:10px 2px;white-space:nowrap;word-break:keep-all;letter-spacing:-.3px;border:2.5px solid var(--ink);border-radius:12px;
    background:#fff;color:var(--ink);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  .lnk .ic{font-size:20px;line-height:1}
  .lnk:hover{background:var(--sun)}

  .recent{margin-top:22px}
  .head{display:flex;justify-content:space-between;align-items:center}
  .wipe{font:inherit;font-size:13px;background:none;border:none;text-decoration:underline;cursor:pointer;color:var(--ink);opacity:.7}
  .empty{font-size:14px;opacity:.6}
  .hint{text-align:center;font-size:13px;opacity:.65;margin-top:26px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo" id="logo" aria-label="SU!!!" title="처음으로">SU<span>!</span><span>!</span><span>!</span></h1>
    <p class="tag">궁금한 건 뭐든지, 한 번에 슉!</p>
  </header>

  <main class="box">
    <form id="f" class="row" autocomplete="off">
      <div class="field">
        <input id="q" type="search" placeholder="뭐가 궁금해?" aria-label="검색어" enterkeyhint="search">
        <button type="button" class="clear" id="clear" aria-label="지우기">✕</button>
      </div>
      <button id="go" class="go" type="submit" disabled>SU!</button>
    </form>
  </main>

  <section id="result" class="box">
    <h2 class="q-title" id="qTitle"></h2>
    <div class="answer" id="answer"></div>

    <div class="section">
      <div class="label">다른 곳에서도 찾아보기</div>
      <div class="links" id="links"></div>
    </div>
  </section>

  <section class="recent box">
    <div class="head">
      <div class="label">최근 검색</div>
      <button class="wipe" id="wipe" type="button">전체 지우기</button>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <p class="hint">SU!!!의 답은 AI가 알고 있는 내용으로 만들어요.<br>오늘 뉴스처럼 아주 최신 소식은 아래 링크로 확인해 주세요.</p>
</div>

<script>
(function(){
  var ENGINES = [
    {name:'구글',     ic:'🔎', url:function(q){return 'https://www.google.com/search?q='+q}},
    {name:'네이버',   ic:'🟢', url:function(q){return 'https://search.naver.com/search.naver?query='+q}},
    {name:'유튜브',   ic:'▶️', url:function(q){return 'https://www.youtube.com/results?search_query='+q}},
    {name:'다음',     ic:'🔵', url:function(q){return 'https://search.daum.net/search?q='+q}},
    {name:'나무위키', ic:'🌳', url:function(q){return 'https://namu.wiki/Search?q='+q}},
    {name:'위키백과', ic:'📚', url:function(q){return 'https://ko.wikipedia.org/w/index.php?search='+q}},
    {name:'이미지',   ic:'🖼️', url:function(q){return 'https://www.google.com/search?tbm=isch&q='+q}},
    {name:'지도',     ic:'🗺️', url:function(q){return 'https://map.naver.com/p/search/'+q}}
  ];

  var store = {
    get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
    set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  };

  var $ = function(id){return document.getElementById(id)};
  var q=$('q'), go=$('go'), clearBtn=$('clear'), answer=$('answer'), qTitle=$('qTitle');
  var links=$('links'), chips=$('chips');
  var recent = store.get('su_recent',[]); if(!Array.isArray(recent)) recent=[];
  // window.claude는 페이지가 뜬 뒤 조금 늦게 생길 수 있어서, 생길 때까지 기다렸다가 연결해요
  var sampleReady = null;
  function waitClaude(ms){
    return new Promise(function(resolve){
      var t0=Date.now();
      (function check(){
        if(window.claude && typeof window.claude.use==='function') return resolve(window.claude);
        if(Date.now()-t0>ms) return resolve(null);
        setTimeout(check,50);
      })();
    });
  }
  function getSample(){
    if(sampleReady) return sampleReady;
    var p = waitClaude(12000).then(function(c){
      if(!c) return null;
      return Promise.resolve(c.use('sample')).catch(function(){return null});
    }).then(function(sm){
      if(!sm) sampleReady=null; // 실패하면 다음 검색 때 다시 시도
      return sm;
    });
    sampleReady = p;
    return p;
  }
  getSample(); // 미리 연결해 두기
  var cache = store.get('su_cache',{}); if(!cache||typeof cache!=='object') cache={};
  function saveCache(k,t){
    cache[k]={t:t,at:Date.now()};
    var keys=Object.keys(cache).sort(function(a,b){return cache[b].at-cache[a].at});
    keys.slice(40).forEach(function(x){delete cache[x]});
    store.set('su_cache',cache);
  }
  var controller = null;
  var aiOff = false;

  function esc(s){return s.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}

  // 아주 작은 마크다운 변환기
  function render(md){
    var lines = md.replace(/\r/g,'').split('\n');
    var html='', inList=false, first=true;
    lines.forEach(function(raw){
      var line=raw.trim();
      if(/^관련\s*[:：]/.test(line)) return;
      if(!line){ if(inList){html+='</ul>';inList=false} return; }
      var m;
      if((m=line.match(/^[-*•]\s+(.*)/))){
        if(!inList){html+='<ul>';inList=true}
        html+='<li>'+inline(m[1])+'</li>'; first=false; return;
      }
      if(inList){html+='</ul>';inList=false}
      if((m=line.match(/^#{1,4}\s+(.*)/))){ html+='<h3>'+inline(m[1])+'</h3>'; first=false; return; }
      html+= first ? '<p class="summary">'+inline(line)+'</p>' : '<p>'+inline(line)+'</p>';
      first=false;
    });
    if(inList) html+='</ul>';
    return html;
  }

  function relatedFrom(text){
    var m = text.match(/관련\s*[:：]\s*(.+)/);
    if(!m) return [];
    return m[1].split(/[|,·]/).map(function(s){return s.replace(/\*\*/g,'').trim()}).filter(Boolean).slice(0,5);
  }

  function renderLinks(text){
    var e=encodeURIComponent(text);
    links.innerHTML='';
    ENGINES.forEach(function(g){
      var a=document.createElement('a');
      a.className='lnk'; a.href=g.url(e); a.target='_blank'; a.rel='noopener';
      a.innerHTML='<span class="ic">'+g.ic+'</span>'+g.name;
      links.appendChild(a);
    });
  }

  function renderRelated(){}

  function remember(text){
    recent = recent.filter(function(r){return r!==text});
    recent.unshift(text); recent=recent.slice(0,12);
    store.set('su_recent',recent); renderRecent();
  }
  function renderRecent(){
    chips.innerHTML='';
    if(!recent.length){var p=document.createElement('div');p.className='empty';p.textContent='아직 검색한 게 없어요';chips.appendChild(p);return}
    recent.forEach(function(r){
      var c=document.createElement('button');
      c.type='button'; c.className='chip'; c.textContent=r;
      c.addEventListener('click',function(){search(r)});
      chips.appendChild(c);
    });
  }

  function prompt(text){
    return [
      '너는 "SU!!!"라는 한국어 검색 서비스야. 사용자가 검색창에 입력한 검색어에 대해 검색 결과처럼 답해줘.',
      '',
      '규칙:',
      '- 한국어로, 초등학생부터 어른까지 누구나 이해하기 쉽게 써.',
      '- 첫 줄: 핵심 답을 1~2문장으로 바로 말해. (머리말, 인사, "좋은 질문" 같은 말 금지)',
      '- 그다음: 알아두면 좋은 내용을 "- "로 시작하는 짧은 항목 3개로 정리해. 중요한 단어는 **굵게**.',
      '- 전체를 짧게. 소제목은 쓰지 마.',
      '- 확실하지 않은 건 지어내지 말고 모른다고 해. 최신 뉴스·가격·날씨·경기 결과처럼 계속 바뀌는 정보면 "최신 정보는 아래 링크에서 확인해 주세요"라고 한 줄 덧붙여.',
      '- 아이에게 위험하거나 부적절한 내용은 알려주지 말고, 믿을 수 있는 어른에게 물어보라고 안내해.',
      '',
      '검색어: ' + text
    ].join('\n');
  }

  function showThinking(){
    answer.innerHTML='<div class="thinking"><span class="dots"><span></span><span></span><span></span></span>슉! 찾는 중...</div>';
  }

  function search(text){
    text=(text||'').trim();
    if(!text) return;
    q.value=text; update();
    document.body.classList.add('has-result');
    qTitle.textContent='“'+text+'”';
    renderLinks(text); renderRelated([]);
    remember(text);
    window.scrollTo({top:0,behavior:'smooth'});

    if(controller){try{controller.abort()}catch(e){}}
    controller = new AbortController();
    var my = controller;

    var hit = cache[text];
    if(hit && hit.t && Date.now()-hit.at < 7*24*3600*1000){
      answer.innerHTML = render(hit.t); renderRelated(relatedFrom(hit.t)); return;
    }

    if(aiOff){ answer.innerHTML='<div class="err">지금은 SU!!! 안에서 답을 만들 수 없어요. 아래 링크로 찾아봐 주세요!</div>'; return; }
    showThinking();

    getSample().then(function(sample){
      if(!sample){
        answer.innerHTML='<div class="err">SU!!! 검색 연결이 아직 안 됐어요. 다시 SU!를 눌러 보세요. 계속 안 되면 이 화면에서는 AI 검색이 막혀 있는 거라, 브라우저에서 claude.ai로 열어 주세요. 아래 링크로도 찾을 수 있어요!</div>';
        return;
      }
      return sample(prompt(text), {
        signal: my.signal,
        modelTier: 'quick',
        cache: true,
        onText: function(ev){
          if(my!==controller) return;
          if(ev.text) answer.innerHTML = render(ev.text);
        }
      }).then(function(res){
        if(my!==controller) return;
        var t=(res && res.text) || '';
        answer.innerHTML = render(t) || '<div class="err">답을 찾지 못했어요. 아래 링크로 찾아봐 주세요!</div>';
        if(res && res.truncated) answer.innerHTML += '<p class="note">답이 길어서 중간에 잘렸어요.</p>';
        renderRelated(relatedFrom(t));
        if(t && !(res && res.truncated)) saveCache(text,t);
      });
    }).catch(function(err){
      if(my!==controller) return;
      if(err && err.name==='AbortError') return;
      var code = err && err.code;
      var msg = '앗, 답을 가져오지 못했어요. 잠시 후 다시 해보거나 아래 링크로 찾아봐 주세요!';
      if(code==='not_granted'){aiOff=true; msg='SU!!! 검색을 쓰려면 사용 허락이 필요해요. 허락하지 않았다면 아래 링크로 찾아봐 주세요!';}
      if(code==='rate_limited') msg='검색을 너무 많이 해서 잠깐 쉬어야 해요. 조금 있다가 다시 해주세요!';
      if(err && err.text){ answer.innerHTML = render(err.text) + '<div class="err">'+msg+'</div>'; }
      else answer.innerHTML='<div class="err">'+msg+'</div>';
    });
  }

  function update(){
    clearBtn.classList.toggle('show', q.value.length>0);
    go.disabled = !q.value.trim();
  }

  q.addEventListener('input',update);
  clearBtn.addEventListener('click',function(){q.value='';update();q.focus()});
  $('f').addEventListener('submit',function(ev){ev.preventDefault(); q.blur(); search(q.value)});
  $('wipe').addEventListener('click',function(){recent=[];store.set('su_recent',recent);renderRecent()});
  $('logo').addEventListener('click',function(){
    if(controller){try{controller.abort()}catch(e){}} controller=null;
    document.body.classList.remove('has-result'); q.value=''; update(); q.focus();
  });

  renderRecent(); update();
})();
</script>
</body>
</html>
